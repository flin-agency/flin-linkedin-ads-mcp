name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.11"
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Quality gates
        run: |
          uv run --locked ruff check .
          uv run --locked mypy src
          uv run --locked pytest -q
      - name: Build distributions and desktop extension
        run: |
          uv run --locked python -m build
          uv run --locked python scripts/build_desktop_extension.py
          uv run --locked python scripts/smoke_desktop_extension.py --wheel dist/*.whl
      - name: Audit locked runtime dependencies
        if: matrix.python == '3.12'
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt" > /dev/null
          uv run --locked pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --no-deps --disable-pip
