name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or recover (for example v0.3.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    # The bundle contains portable Python source; macOS is tested separately in CI.
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.11"
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Verify tag and quality gates
        run: |
          uv run --locked python -c 'import os, tomllib; from pathlib import Path; assert os.environ["RELEASE_TAG"] == "v" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]'
          uv run --locked ruff check .
          uv run --locked mypy src
          uv run --locked pytest -q
      - name: Audit runtime dependencies
        run: |
          uv export --project desktop-extension --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt" > /dev/null
          uv run --locked pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --no-deps --disable-pip
      - name: Build and verify distributions
        run: |
          uv run --locked python -m build
          uv run --locked twine check dist/*.whl dist/*.tar.gz
          npx --yes @anthropic-ai/mcpb@2.1.2 validate desktop-extension/manifest.json
          uv run --locked python scripts/build_desktop_extension.py
          uv run --locked python scripts/smoke_desktop_extension.py
      - name: Check existing GitHub files before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            mkdir "$RUNNER_TEMP/existing-release"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/existing-release"
            for file in dist/*; do
              existing="$RUNNER_TEMP/existing-release/$(basename "$file")"
              if [ -f "$existing" ]; then
                cmp "$file" "$existing"
              fi
            done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-artifacts
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Recovery must not replace files people have already downloaded.
            mkdir existing
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir existing
            for file in dist/*; do
              name=$(basename "$file")
              if [ -f "existing/$name" ]; then
                cmp "$file" "existing/$name"
              else
                gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG – Claude Desktop für macOS" --generate-notes
          fi

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-artifacts
          path: artifacts
      - name: Select Python distributions
        run: |
          mkdir dist
          cp artifacts/*.whl artifacts/*.tar.gz dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
      - name: Verify published PyPI files and hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"][1:]
          url = f"https://pypi.org/pypi/flin-linkedin-ads-mcp/{version}/json"
          expected = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in Path("dist").iterdir() if path.is_file()}
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      data = json.load(response)
                  actual = {item["filename"]: item["digests"]["sha256"] for item in data["urls"]}
                  if all(actual.get(name) == digest for name, digest in expected.items()):
                      print(f"Verified {len(expected)} PyPI files for {version}")
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              if attempt == 11:
                  raise SystemExit("PyPI files are missing or differ from the built artifacts")
              time.sleep(5)
          PY
