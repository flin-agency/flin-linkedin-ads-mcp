name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or recover (for example v0.3.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    # The bundle contains portable Python source; macOS is tested separately in CI.
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.11"
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Verify tag and quality gates
        run: |
          uv run --locked python -c 'import os, tomllib; from pathlib import Path; assert os.environ["RELEASE_TAG"] == "v" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]'
          uv run --locked ruff check .
          uv run --locked mypy src
          uv run --locked pytest -q
      - name: Audit runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt" > /dev/null
          uv run --locked pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --no-deps --disable-pip
      - name: Build and verify distributions
        run: |
          uv run --locked python -m build
          uv run --locked twine check dist/*.whl dist/*.tar.gz
          npx --yes @anthropic-ai/mcpb@2.1.2 validate desktop-extension/manifest.json
          uv run --locked python scripts/build_desktop_extension.py
          if [ -f desktop-extension/uv.lock ]; then
            uv run --locked python scripts/smoke_desktop_extension.py
          elif grep -q -- '--upgrade-from' scripts/smoke_desktop_extension.py; then
            uv run --locked python scripts/smoke_desktop_extension.py --wheel dist/*.whl --upgrade-from 0.3.2
          else
            uv run --locked python scripts/smoke_desktop_extension.py --wheel dist/*.whl
          fi
      - name: Check existing GitHub files before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            mkdir "$RUNNER_TEMP/existing-release"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/existing-release"
            python3 - <<'PYCODE'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import tarfile

          def source_files(path):
              result = {}
              with tarfile.open(path, "r:gz") as archive:
                  for member in archive.getmembers():
                      if member.isdir():
                          continue
                      if not member.isfile() or member.name in result:
                          raise SystemExit(f"Unsupported or duplicate source entry: {member.name}")
                      content = archive.extractfile(member).read()
                      # v0.3.1's local sdist included one ignored worktree example file.
                      # It contains only REPLACE_ME, not a credential. Preserve the published
                      # archive only for this exact path and verified harmless template hash.
                      if (member.name == "flin_linkedin_ads_mcp-0.3.1/.worktrees/mcp-v1-hotfix/.env.example"
                              and hashlib.sha256(content).hexdigest()
                              == "a3ec72e8921ea40875701696d5c47b0a49a10974db17da17711f34d6080913ac"):
                          continue
                      result[member.name] = (content, member.mode & 0o111)
              return result

          for built in Path("dist").iterdir():
              existing = Path(os.environ["RUNNER_TEMP"]) / "existing-release" / built.name
              if not existing.exists() or built.read_bytes() == existing.read_bytes():
                  continue
              if built.name.endswith(".tar.gz"):
                  current, published = source_files(built), source_files(existing)
                  changed = sorted(name for name in current.keys() | published.keys()
                                   if current.get(name) != published.get(name))
                  if not changed:
                      # Compression/tar metadata can vary across OS/Python versions.
                      # Preserve the exact previously published bytes after checking all source files.
                      shutil.copyfile(existing, built)
                      print(f"Identical source contents; preserving published archive: {built.name}")
                      continue
                  print("Different source entries:", changed)
              raise SystemExit(f"Existing release content differs: {built.name}")
          PYCODE
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [build, publish-pypi, verify-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-artifacts
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Recovery must not replace files people have already downloaded.
            mkdir existing
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir existing
            for file in dist/*; do
              name=$(basename "$file")
              if [ -f "existing/$name" ]; then
                cmp "$file" "existing/$name"
              else
                gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG – Claude Desktop für macOS" --generate-notes
          fi

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-artifacts
          path: artifacts
      - name: Select Python distributions
        run: |
          mkdir dist
          cp artifacts/*.whl artifacts/*.tar.gz dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
      - name: Verify published PyPI files and hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"][1:]
          url = f"https://pypi.org/pypi/flin-linkedin-ads-mcp/{version}/json"
          expected = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in Path("dist").iterdir()
                      if path.name.endswith((".whl", ".tar.gz"))}
          if len(expected) != 2:
              raise SystemExit("Expected exactly one wheel and one source distribution")
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      data = json.load(response)
                  actual = {item["filename"]: item["digests"]["sha256"] for item in data["urls"]}
                  if all(actual.get(name) == digest for name, digest in expected.items()):
                      print(f"Verified {len(expected)} PyPI files for {version}")
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              if attempt == 11:
                  raise SystemExit("PyPI files are missing or differ from the built artifacts")
              time.sleep(5)
          PY

  verify-desktop:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.11"
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-artifacts
          path: dist
      - name: Wait for public installation index
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"][1:]
          wheel = f"flin_linkedin_ads_mcp-{version}-py3-none-any.whl"
          request = urllib.request.Request(
              "https://pypi.org/simple/flin-linkedin-ads-mcp/",
              headers={"Accept": "application/vnd.pypi.simple.v1+json", "Cache-Control": "no-cache"},
          )
          for attempt in range(36):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      files = json.load(response)["files"]
                  if any(item["filename"] == wheel and not item.get("yanked") for item in files):
                      print(f"Stable wheel visible in public index: {version}")
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              if attempt == 35:
                  raise SystemExit("Release uploaded but public installation index is not ready")
              time.sleep(5)
          PY
      - name: Test extension against public PyPI
        run: |
          uv sync --locked --extra dev
          if grep -q -- '--upgrade-from' scripts/smoke_desktop_extension.py; then
            uv run --locked python scripts/smoke_desktop_extension.py --upgrade-from 0.3.2
          else
            uv run --locked python scripts/smoke_desktop_extension.py
          fi
